name: MCP Server CI

on:
  push:
    branches: [master, main]
    paths:
      - 'mcp-server/**'
      - 'specs/**'
      - 'tools/**'
      - 'schemas/**'
      - 'README.md'
      - '.github/workflows/mcp-server-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'mcp-server/**'
      - 'specs/**'
      - 'tools/**'
      - 'schemas/**'
      - 'README.md'
      - '.github/workflows/mcp-server-ci.yml'

jobs:
  test:
    name: Test MCP Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt
          cd mcp-server
          pip install -e ".[dev]"
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install diagram parser
        run: npm ci --prefix tools --ignore-scripts
      - name: Run tests
        run: |
          cd mcp-server
          pytest tests/ -v --tb=short
        env:
          LIA_SPECS_DIR: ${{ github.workspace }}/specs
      
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run linter
        run: |
          cd mcp-server
          ruff check src/ --ignore E501

  validate-specs:
    name: Validate Specs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install diagram parser
        run: npm ci --prefix tools --ignore-scripts
      - name: Install schema validator
        run: python -m pip install -r tools/requirements.txt
      - name: Validate the shipped workflow catalog
        run: python tools/spec-validator.py specs/

  integration:
    name: Integration Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    needs: [test, validate-specs]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache installer dependencies with the minimum MCP SDK
        run: |
          python -m pip download --dest "$RUNNER_TEMP/lia-wheels" ./mcp-server 'mcp==1.30.0' hatchling editables

      - name: Install offline and read the catalog with an unusable python3 on PATH
        run: |
          export PIP_FIND_LINKS="$RUNNER_TEMP/lia-wheels"
          bash mcp-server/tests/check_global_install.sh
