name: MCP Server CI

on:
  push:
    branches: [master, main]
    paths:
      - 'mcp-server/**'
      - 'specs/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/mcp-server-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'mcp-server/**'
      - 'specs/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/mcp-server-ci.yml'

jobs:
  test:
    name: Test MCP Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd mcp-server
          pip install -e ".[dev]"
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install diagram parser
        run: npm ci --prefix tools --ignore-scripts
      - name: Run tests
        run: |
          cd mcp-server
          pytest tests/ -v --tb=short
        env:
          LIA_SPECS_DIR: ${{ github.workspace }}/specs
      
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run linter
        run: |
          cd mcp-server
          ruff check src/ --ignore E501

  validate-specs:
    name: Validate Specs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install diagram parser
        run: npm ci --prefix tools --ignore-scripts
      - name: Validate the shipped workflow catalog
        run: python tools/spec-validator.py specs/

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test, validate-specs]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install and read the catalog with the minimum MCP SDK
        run: |
          python -m venv "$RUNNER_TEMP/lia installer"
          source "$RUNNER_TEMP/lia installer/bin/activate"
          export HOME="$RUNNER_TEMP/lia-home"
          export PIP_CONSTRAINT="$RUNNER_TEMP/mcp-floor.txt"
          echo 'mcp==1.30.0' > "$PIP_CONSTRAINT"
          ./mcp-server/install.sh --global
          python3 mcp-server/tests/check_global_install.py
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      
      - name: Test MCP server functions
        run: |
          python -c "
          import asyncio
          import os
          import sys
          
          sys.path.insert(0, 'mcp-server/src')
          os.environ['LIA_SPECS_DIR'] = 'specs'
          
          from lia_workflow_mcp.server import (
              initialise_specs,
              list_resources,
              list_tools,
              list_prompts,
              call_tool,
          )
          
          initialise_specs()
          
          async def test():
              # Test resources
              resources = await list_resources()
              assert len(resources) > 30, f'Expected >30 resources, got {len(resources)}'
              print(f'✓ Resources: {len(resources)}')
              
              # Test tools
              tools = await list_tools()
              assert len(tools) >= 10, f'Expected >=10 tools, got {len(tools)}'
              print(f'✓ Tools: {len(tools)}')
              
              # Test prompts
              prompts = await list_prompts()
              assert sum(p.name.startswith('start-') for p in prompts) == 19
              print(f'✓ Prompts: {len(prompts)}')
              
              # Test tool call
              result = await call_tool('search_specs', {'query': 'security'})
              assert len(result) > 0
              print('✓ Tool calls working')
              
              # Test recommendation
              result = await call_tool('recommend_workflow', {'task_description': 'implement a feature'})
              assert 'dev' in result[0].text.lower()
              print('✓ Recommendations working')
              
              print()
              print('All integration tests passed!')
          
          asyncio.run(test())
          "
